<style>
/* Layout: Vollbild-Karte, oben schmale Vorratsleiste, unten ausfahrendes Aktionsblatt, rechts drei Rundknöpfe. */

  --body:"Alegreya Sans","Trebuchet MS","Segoe UI",sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}

body{margin:0;background:#1e4e86;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#hint{position:absolute;left:0;right:0;padding-block:4px;padding-left:var(--gl);padding-right:var(--gr);background:rgba(36,27,19,.72);color:var(--ink);font-size:14px;pointer-events:none}

#panel h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0 0 4px;color:var(--brass);display:flex;justify-content:space-between;align-items:center;gap:8px}
#panel p{margin:2px 0;color:var(--ink);line-height:1.3}

.btn{background:var(--wood3);border:1px solid #6b5538;border-radius:6px;padding:10px 14px;font-weight:700;min-height:44px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin-top:8px}

<div id="app">
  <canvas id="cv"></canvas>
  <div id="top"></div>
  <div id="hint"></div>
  <div id="side">
    <button class="rb" id="bMenu" aria-label="Menü">☰</button>
    <button class="rb" id="bSpeed" aria-label="Spielgeschwindigkeit">1×</button>
    <button class="rb on" id="bAid" aria-label="Bauhilfe ein/aus">⌂</button>
    <button class="rb" id="bHome" aria-label="Zur Burg springen">♜</button>
  </div>
  <div id="toast" hidden></div>
  <div id="panel" hidden></div>
  <div id="modal" hidden><div id="mbox"></div></div>
</div>

<script>
"use strict";
/* ============ Konstanten & Geometrie ============ */
const W=64,H=88,N=W*H,TW=40,TH=20,HS=4,PADT=70,WW=W*TW+TW,WH=H*TH+PADT+20;
const fx=i=>((i%W)+((i/W|0)&1)*.5)*TW+TW/2, fy0=i=>(i/W|0)*TH+PADT;
let G=null;
let EH=new Float32Array(N);
const py=i=>fy0(i)-EH[i]*HS;
function nb(i,d){const c=i%W,r=i/W|0,o=r&1;let nc,nr;
  switch(d){case 0:nc=c+1;nr=r;break;case 1:nc=c+o;nr=r+1;break;case 2:nc=c+o-1;nr=r+1;break;case 3:nc=c-1;nr=r;break;case 4:nc=c+o-1;nr=r-1;break;default:nc=c+o;nr=r-1}
  return(nc<0||nr<0||nc>=W||nr>=H)?-1:nr*W+nc}
const D=(i,j)=>Math.hypot((fx(i)-fx(j))/TW,((i/W|0)-(j/W|0))*.866);
function around(i,R,fn){const r=i/W|0,c=i%W,rr=Math.ceil(R/.866),cr=Math.ceil(R)+1;
  for(let y=Math.max(0,r-rr);y<=Math.min(H-1,r+rr);y++)for(let x=Math.max(0,c-cr);x<=Math.min(W-1,c+cr);x++){const j=y*W+x;if(D(i,j)<=R)fn(j)}}
function hash2(x,y,s){let h=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(s,69069);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y,s)=>vnoise(x,y,s)*.55+vnoise(x*2,y*2,s+1)*.3+vnoise(x*4,y*4,s+2)*.15;
const rnd=Math.random;

/* ============ Spieldaten ============ */
const GOODS={log:'Stämme',plank:'Bretter',stone:'Steine',fish:'Fisch',grain:'Getreide',flour:'Mehl',bread:'Brot',pig:'Schweine',meat:'Fleisch',coal:'Kohle',ironore:'Eisenerz',goldore:'Golderz',iron:'Eisen',gold:'Gold',tool:'Werkzeug',weapon:'Waffen'};
const FOOD=['fish','bread','meat'];
const RES=[null,'Kohle','Eisenerz','Golderz','Granit'];
const BD={
  hq:{n:'Burg',sz:'L',mil:{cap:8,r:9.5,gold:0,def:1.3},d:'Dein Hauptsitz: Lager, Wohnort der Siedler und Ritter.'},
  woodcutter:{n:'Holzfäller',c:[2,0],sz:'S',out:'log',job:'tree',d:'Fällt Bäume in der Nähe.'},
  forester:{n:'Förster',c:[2,0],sz:'S',job:'plant',d:'Pflanzt neue Bäume.'},
  quarry:{n:'Steinmetz',c:[2,0],sz:'S',out:'stone',job:'stone',d:'Bricht Steine aus Felsen in der Nähe.'},
  sawmill:{n:'Sägewerk',c:[3,2],sz:'L',in:{log:1},out:'plank',time:6,d:'Stämme → Bretter.'},
  fisher:{n:'Fischer',c:[2,0],sz:'S',out:'fish',job:'fish',d:'Angelt am nahen Ufer. Nahrung für Bergleute.'},
  farm:{n:'Bauernhof',c:[4,1],sz:'L',out:'grain',job:'farm',d:'Sät und erntet Getreide auf freiem Land.'},
  mill:{n:'Windmühle',c:[3,1],sz:'L',in:{grain:1},out:'flour',time:6,d:'Getreide → Mehl.'},
  bakery:{n:'Bäckerei',c:[2,2],sz:'L',in:{flour:1},out:'bread',time:6,d:'Mehl → Brot.'},
  pigfarm:{n:'Schweinezucht',c:[3,1],sz:'L',in:{grain:1},out:'pig',time:9,d:'Getreide → Schweine.'},
  butcher:{n:'Metzger',c:[2,1],sz:'S',in:{pig:1},out:'meat',time:5,d:'Schweine → Fleisch.'},
  coalmine:{n:'Kohlemine',c:[4,0],sz:'M',in:{food:1},out:'coal',mine:1,time:8,d:'Braucht Nahrung. Fördert Kohle.'},
  ironmine:{n:'Eisenmine',c:[4,0],sz:'M',in:{food:1},out:'ironore',mine:2,time:8,d:'Braucht Nahrung. Fördert Eisenerz.'},
  goldmine:{n:'Goldmine',c:[4,0],sz:'M',in:{food:1},out:'goldore',mine:3,time:9,d:'Braucht Nahrung. Fördert Golderz.'},
  stonemine:{n:'Granitmine',c:[4,0],sz:'M',in:{food:1},out:'stone',mine:4,time:8,d:'Braucht Nahrung. Fördert Steine.'},
  smelter:{n:'Eisenschmelze',c:[3,3],sz:'L',in:{ironore:1,coal:1},out:'iron',time:7,d:'Eisenerz + Kohle → Eisen.'},
  goldsmelter:{n:'Goldschmelze',c:[3,3],sz:'L',in:{goldore:1,coal:1},out:'gold',time:7,d:'Golderz + Kohle → Gold. Gold stärkt Ritter.'},
  toolmaker:{n:'Werkzeugmacher',c:[3,2],sz:'L',in:{plank:1,iron:1},out:'tool',time:8,d:'Brett + Eisen → Werkzeug für neue Berufe.'},
  weaponsmith:{n:'Waffenschmied',c:[3,3],sz:'L',in:{iron:1,coal:1},out:'weapon',time:8,d:'Eisen + Kohle → Schwert und Schild.'},
  hut:{n:'Wachhütte',c:[2,1],sz:'S',mil:{cap:3,r:5.5,gold:1,def:1},d:'Erweitert dein Gebiet. 3 Ritter.'},
  tower:{n:'Wachturm',c:[3,4],sz:'L',mil:{cap:6,r:7.5,gold:2,def:1.2},d:'Größeres Gebiet. 6 Ritter.'},
  fortress:{n:'Festung',c:[6,8],sz:'L',mil:{cap:10,r:9.5,gold:4,def:1.4},d:'Sehr großes Gebiet. 10 Ritter.'}
};
const GROUPS=[['Grundversorgung',['woodcutter','forester','quarry','sawmill']],['Militär',['hut','tower','fortress']],['Nahrung',['fisher','farm','mill','bakery','pigfarm','butcher']],['Bergbau',['coalmine','ironmine','goldmine','stonemine']],['Handwerk',['smelter','goldsmelter','toolmaker','weaponsmith']]];
const PCOL=['#3d7fe0','#d2452f'],PDARK=['#1d4a94','#7c2114'];
const DIFF=[{n:'Leicht',mat:32,wp:130,grace:720},{n:'Normal',mat:20,wp:75,grace:420},{n:'Schwer',mat:12,wp:42,grace:240}];

/* transiente Daten (nicht im Spielstand) */
let routeCache={},border=[],fxs=[],resv=new Set(),terrain=null,aiBad=new Set();

/* ============ Kartenerzeugung ============ */
function newGame(seed,diff){
  for(let tries=0;tries<30;tries++){ if(genGame(seed+tries*7919,diff))break }
  routeCache={};fxs=[];resv=new Set();aiBad=new Set();recalcTerritory();renderTerrain();
}
function genGame(seed,diff){
  G={v:1,seed,diff,time:0,nid:1,ver:1,h:[],t:[],obj:[],ov:[],own:[],res:[],ra:[],sign:[],fl:[],bl:[],rd:[],flags:{},roads:{},blds:{},units:{},P:[],over:null,ai:{t:0,mt:0,wt:0,at:0}};
  let s=seed>>>0;const R=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  for(let i=0;i<N;i++){
    const c=i%W,r=i/W|0,X=fx(i)/TW,Y=r*.866;
    let e=fbm(X/11,Y/11,seed);const m=Math.max(Math.abs(X/64-.5),Math.abs(Y/76-.5))*2;e-=Math.pow(m,4)*.7;
    let t=e<.37?0:e>.585?2:1;if(c==0||r==0||c==W-1||r==H-1)t=0;
    G.t[i]=t;G.h[i]=t==0?0:Math.round((t==1?1+(e-.37)*14:4+(e-.585)*42)*10)/10;
    G.obj[i]=0;G.ov[i]=0;G.own[i]=-1;G.res[i]=0;G.ra[i]=0;G.sign[i]=0;G.fl[i]=0;G.bl[i]=0;G.rd[i]=0;
    if(t==1){
      if(fbm(X/5,Y/5,seed+7)>.54&&R()<.62){G.obj[i]=1;G.ov[i]=1}
      else if(vnoise(X/3.5,Y/3.5,seed+9)>.8&&R()<.5){G.obj[i]=2;G.ov[i]=3+(R()*4|0)}
    }else if(t==2){
      const v=vnoise(X/4,Y/4,seed+20),k=v<.3?1:v<.55?2:v<.7?3:v<.85?4:0;
      if(k&&R()<.85){G.res[i]=k;G.ra[i]=8+(R()*10|0)}
    }
  }
  const zones=[[.12,.42,.55,.88],[.58,.88,.12,.45]],hqs=[];
  for(let p=0;p<2;p++){
    const z=zones[p];let best=-1,bs=-1;
    for(let i=0;i<N;i++){
      if(G.t[i]!=1)continue;const X=fx(i)/TW/64,Y=(i/W|0)/H;if(X<z[0]||X>z[1]||Y<z[2]||Y>z[3])continue;
      let ok=true;for(let d=0;d<6;d++){const j=nb(i,d);if(j<0||G.t[j]!=1)ok=false}if(!ok)continue;
      let g=0,mt=0,wa=0;around(i,11,j=>{const dd=D(i,j);if(dd<=6&&G.t[j]==1)g++;if(G.t[j]==2)mt++;if(dd<=9&&G.t[j]==0)wa++});
      const sc=g+Math.min(mt,25)*1.2+(mt>6?20:0)+(wa>3?8:0)+hash2(i,p,seed)*3;if(sc>bs){bs=sc;best=i}
    }
    if(best<0)return false;
    let mt=0;around(best,12,j=>{if(G.t[j]==2)mt++});if(mt<8)return false;
    hqs.push(best);
  }
  for(let p=0;p<2;p++){
    const n=hqs[p];around(n,2.2,j=>{G.obj[j]=0;G.ov[j]=0});
    let tr=0,stn=0;const free=[];around(n,7,j=>{if(G.obj[j]==1)tr++;if(G.obj[j]==2)stn++;if(G.t[j]==1&&!G.obj[j]&&D(n,j)>3)free.push(j)});
    while(tr<16&&free.length){const j=free.splice(R()*free.length|0,1)[0];G.obj[j]=1;G.ov[j]=1;tr++}
    while(stn<6&&free.length){const j=free.splice(R()*free.length|0,1)[0];G.obj[j]=2;G.ov[j]=5;stn++}
    G.P[p]={hq:0,settlers:30,sacc:0,stock:{log:6,plank:26,stone:18,fish:6,grain:0,flour:0,bread:4,pig:0,meat:0,coal:2,ironore:0,goldore:0,iron:2,gold:0,tool:14,weapon:6},made:{}};
    G.own[n]=p;G.own[nb(n,1)]=p;
    const f=mkFlag(nb(n,1),p),b={id:G.nid++,type:'hq',n,o:p,f:f.id,done:true,prog:1,got:{plank:0,stone:0},enr:{},st:{},w:2,bw:0,tm:0,g:4,ke:0,gold:0,occ:true};
    G.blds[b.id]=b;G.bl[n]=b.id;f.b=b.id;G.P[p].hq=b.id;
  }
  return true;
}

/* ============ Gebiet ============ */
function milList(){const a=[];for(const id in G.blds){const b=G.blds[id];if(BD[b.type].mil&&b.occ)a.push(b)}return a}
function recalcTerritory(){
  const ml=milList();
  for(let i=0;i<N;i++){
    let cur=G.own[i],keep=false,best=-1,bd=1e9;
    for(const b of ml){const d=D(i,b.n);if(d<=BD[b.type].mil.r){if(b.o==cur)keep=true;if(d<bd){bd=d;best=b.o}}}
    if(!keep)G.own[i]=best;
  }
  for(const b of ml){G.own[b.n]=b.o}
  const df=[],db=[],dr=[];
  for(const id in G.blds){const b=G.blds[id];if(G.own[b.n]!==b.o)db.push(b.id)}
  for(const id in G.roads){const r=G.roads[id];if(r.p.some((n,k)=>k>0&&k<r.p.length-1&&G.own[n]!==r.o))dr.push(r.id)}
  for(const id in G.flags){const f=G.flags[id];if(G.own[f.n]!==f.o&&!(f.b&&G.blds[f.b]&&G.blds[f.b].occ))df.push(f.id)}
  dr.forEach(removeRoad);db.forEach(id=>destroyBld(id,true));df.forEach(removeFlag);
  border=[];for(let i=0;i<N;i++){const o=G.own[i];if(o<0)continue;for(let d=0;d<6;d++){const j=nb(i,d);if(j<0||G.own[j]!==o){border.push(i);break}}}
}

/* ============ Regeln: Fahnen, Wege, Gebäude ============ */
function canFlag(n,o){
  if(n<0||G.t[n]==0||G.own[n]!==o||G.fl[n]||G.bl[n]||G.obj[n]==1||G.obj[n]==2)return false;
  if(G.rd[n]&&G.roads[G.rd[n]].o!==o)return false;
  for(let d=0;d<6;d++){const j=nb(n,d);if(j>=0&&G.fl[j])return false}
  return true;
}
function canBuildSize(n,o){ // 0 nichts, 1 klein, 2 groß, 3 Mine
  if(n<0||G.own[n]!==o||G.t[n]==0||G.fl[n]||G.bl[n]||G.rd[n]||G.obj[n]==1||G.obj[n]==2)return 0;
  const f=nb(n,1);if(f<0)return 0;
  if(!(G.fl[f]&&G.flags[G.fl[f]].o===o&&!G.flags[G.fl[f]].b)&&!canFlag(f,o))return 0;
  for(const d of[0,3,4,5]){const j=nb(n,d);if(j>=0&&G.bl[j])return 0}
  if(G.t[n]==2)return 3;
  for(let d=0;d<6;d++){const j=nb(n,d);if(j<0||G.t[j]!=1||Math.abs(G.h[j]-G.h[n])>1.6)return 1}
  for(const d of[3,4,5]){const j=nb(n,d);if(G.obj[j]==1||G.obj[j]==2||G.fl[j])return 1}
  return 2;
}
function canBuild(n,type,o){const s=canBuildSize(n,o),z=BD[type].sz;return z=='M'?s==3:z=='L'?s==2:(s==1||s==2)}
function mkFlag(n,o){const f={id:G.nid++,n,o,g:[],r:[],b:0};G.flags[f.id]=f;G.fl[n]=f.id;if(G.obj[n]==3){G.obj[n]=0;G.ov[n]=0}G.sign[n]=0;return f}
function placeFlag(n,o){
  if(!canFlag(n,o))return null;
  const rid=G.rd[n];const f=mkFlag(n,o);
  if(rid){ // Weg teilen
    const R=G.roads[rid],k=R.p.indexOf(n),cu=R.c?G.units[R.c]:null;
    delete G.roads[rid];for(const fid of[R.a,R.b]){const F=G.flags[fid];F.r=F.r.filter(x=>x!=rid)}
    for(const m of R.p)if(G.rd[m]==rid)G.rd[m]=0;
    const r1=mkRoad(o,R.p.slice(0,k+1),R.a,f.id),r2=mkRoad(o,R.p.slice(k),f.id,R.b);
    if(cu){if(cu.g){loseGood(cu.g);cu.g=null}cu.road=r1.id;cu.pos=Math.min(cu.pos,k);cu.st=0;r1.c=cu.id}
    else if(R.cr){for(const id in G.units){const u=G.units[id];if(u.role=='carrier'&&u.d==rid)u.d=r1.id}r1.cr=1}
  }
  G.ver++;return f;
}

/* ============ Routen über das Fahnennetz ============ */

}

/* ============ Waren ============ */
const needKey=(b,t)=>BD[b.type].mine&&FOOD.includes(t)?'food':t;

/* ============ Einheiten ============ */
function spawn(o,role,path,d,extra){const u=Object.assign({id:G.nid++,k:'w',role,o,p:path,i:0,d},extra||{});G.units[u.id]=u;return u}
function pool(u){const P=G.P[u.o];if(u.role=='geo'||u.role=='carrier'||u.role=='builder')P.settlers++;

  const P=G.P[o],hq=G.blds[P.hq];if(!hq)return;const HF=G.flags[hq.f];

    const p=routeNodes(HF.id,R.a);if(!p)continue;const mid=Math.floor((R.p.length-1)/2);for(let k=1;k<=mid;k++)p.push(R.p[k]);
    P.settlers--;R.cr=1;spawn(o,'carrier',p,R.id)}
  let sent=0;const list=Object.values(G.blds).filter(b=>b.o===o);
  list.sort((a,b)=>(a.done-b.done)||(a.id-b.id));
  for(const b of list){
    const def=BD[b.type];if(b.type=='hq'){if(b.g<def.mil.cap&&P.stock.weapon>0&&P.settlers>0){b.g++;P.stock.weapon--;P.settlers--}continue}

const SPD=2.3;
function tickCarrier(u,dt){

/* ============ Gebäude-Simulation ============ */

const AI_ORDER=[['woodcutter',1],['quarry',1],['sawmill',1],['hut',1],['forester',1],['woodcutter',2],['hut',2],['fisher',1],['hut',3],['farm',1],['coalmine',1],['ironmine',1],['smelter',1],['weaponsmith',1],['tower',1],['mill',1],['bakery',1],['hut',5],['toolmaker',1],['goldmine',1],['goldsmelter',1],['fisher',2],['tower',2],['hut',8],['fortress',1],['hut',12],['tower',4]];
function aiSpot(o,type){
  const def=BD[type],hq=G.blds[G.P[o].hq],eh=G.blds[G.P[1-o].hq],mils=milList().filter(b=>b.o===o);
  const allMil=Object.values(G.blds).filter(b=>b.o===o&&BD[b.type].mil);
  const wc=Object.values(G.blds).filter(b=>b.o===o&&b.type=='woodcutter');
  let best=-1,bs=-1e9;
  for(let n=0;n<N;n++){
    if(G.own[n]!==o||aiBad.has(n)||!canBuild(n,type,o))continue;let sc=0,c=0;
    if(type=='woodcutter'){around(n,5,j=>{if(G.obj[j]==1)c++});if(c<3)continue;sc=c-D(n,hq.n)*.3}
    else if(type=='forester'){sc=wc.length?-Math.abs(D(n,wc[0].n)-3):-D(n,hq.n)}
    else if(type=='quarry'){around(n,5,j=>{if(G.obj[j]==2)c+=G.ov[j]});if(c<2)continue;sc=c-D(n,hq.n)*.3}
    else if(type=='fisher'){around(n,4,j=>{if(G.t[j]==0)c++});if(c<2)continue;sc=c-D(n,hq.n)*.3}
    else if(type=='farm'){around(n,3,j=>{if(G.t[j]==1&&!G.obj[j]&&!G.fl[j]&&!G.rd[j]&&!G.bl[j])c++});if(c<10)continue;sc=c-D(n,hq.n)*.4}
    else if(def.mine){around(n,2.3,j=>{if(G.res[j]==def.mine)c+=G.ra[j]});if(c<20)continue;sc=c}
    else if(def.mil){let md=1e9;for(const b of allMil)md=Math.min(md,D(n,b.n));if(md<4.2)continue;
      let mt=0;around(n,5,j=>{if(G.t[j]==2)mt++});let bdist=1e9;for(const j of border)if(G.own[j]===o){const d=D(n,j);if(d<bdist)bdist=d}
      sc=-bdist*2-(eh?D(n,eh.n)*.25:0)+Math.min(mt,12)*.3+rnd()*2}
    else sc=-D(n,hq.n)+rnd()*2;
    if(sc>bs){bs=sc;best=n}
  }
  return best;
}
function aiTick(o,dt){

  A.mt+=dt;A.wt+=dt;A.t+=dt;A.at+=dt;

  if(A.wt>=df.wp){A.wt=0;P.stock.weapon++}
  if(A.t<3)return;A.t=0;
  const cnt={};let sites=0;
  for(const b of Object.values(G.blds)){if(b.o!==o)continue;cnt[b.type]=(cnt[b.type]||0)+1;if(!b.done)sites++;
    if(b.type!='hq'&&!conn(o,b.f)){if(!autoConnect(o,b.f)){b.af=(b.af||0)+1;if(b.af>4&&!b.occ){const f=b.f;destroyBld(b.id);if(G.flags[f]&&!G.flags[f].r.length)removeFlag(f)}}}
    if(b.done&&b.empty)destroyBld(b.id)}
  if(sites<2&&P.stock.plank>=3){
    for(const[t,c]of AI_ORDER){if((cnt[t]||0)>=c)continue;const n=aiSpot(o,t);if(n<0)continue;
      const id=placeBld(o,t,n);if(!id)continue;const f=G.blds[id].f;
      if(!conn(o,f)&&!autoConnect(o,f)){aiBad.add(n);destroyBld(id);if(G.flags[f]&&!G.flags[f].r.length)removeFlag(f);continue}
      break}
  }
  if(G.time>df.grace&&A.at>18){A.at=0;
    const ts=Object.values(G.blds).filter(b=>b.o!==o&&BD[b.type].mil&&b.occ).sort((a,b)=>a.g-b.g);
    for(const t of ts){const n=attackers(o,t.id);if(n>=Math.max(2,t.g+1+(t.type=='hq'?2:0))){attack(o,t.id,n);break}}

}

function layout(){const top=document.getElementById('top'),h=top.offsetHeight;document.getElementById('hint').style.top=h+'px';
  const hh=document.getElementById('hint').offsetHeight;document.getElementById('side').style.top=(h+hh+10)+'px';document.getElementById('toast').style.top=(h+hh+14)+'px'}
function clampCam(){const mz=Math.max(.45,Math.min(vw/WW,1));cam.z=Math.max(mz,Math.min(2.4,cam.z));
  cam.x=Math.max(-vw*.3/cam.z,Math.min(WW-vw*.7/cam.z,cam.x));cam.y=Math.max(-vh*.3/cam.z,Math.min(WH-vh*.6/cam.z,cam.y))}
function center(n){cam.x=fx(n)-vw/2/cam.z;cam.y=py(n)-vh*.42/cam.z;clampCam()}
function nodeAt(wx,wy){const r0=Math.round((wy-PADT)/TH);let best=-1,bd=1e9;
  for(let r=Math.max(0,r0-1);r<=Math.min(H-1,r0+7);r++){const c0=Math.round((wx-TW/2)/TW-(r&1)*.5);
    for(let c=Math.max(0,c0-1);c<=Math.min(W-1,c0+1);c++){const i=r*W+c,d=Math.hypot(fx(i)-wx,py(i)-wy);if(d<bd){bd=d;best=i}}}
  return best}
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size==1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};
  else if(ptrs.size==2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};if(drag)drag.moved=true}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size==2&&pinch){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;zoomAt(mx,my,pinch.z*d/pinch.d)}
  else if(drag&&ptrs.size==1){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;
    if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;clampCam()}}});
const pup=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size==0){if(drag&&!drag.moved&&e.type=='pointerup'){const r=cv.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top)}drag=null;pinch=null}
  else if(ptrs.size==1){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,cx:cam.x,cy:cam.y,moved:true};pinch=null}};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,cam.z*(e.deltaY<0?1.12:.89))},{passive:false});
function zoomAt(sx,sy,z){const wx=cam.x+sx/cam.z,wy=cam.y+sy/cam.z;cam.z=z;clampCam();cam.x=wx-sx/cam.z;cam.y=wy-sy/cam.z;clampCam()}
function tap(sx,sy){
  if(!G||G.over)return;const wx=cam.x+sx/cam.z,wy=cam.y+sy/cam.z;let n=-1;
  if(UI.mode!='road')for(const id in G.blds){const b=G.blds[id],x=fx(b.n),y=py(b.n);if(wx>x-17&&wx<x+17&&wy>y-34&&wy<y+5){n=b.n;break}}
  if(n<0)n=nodeAt(wx,wy);if(n<0)return;
  if(UI.mode=='road'){const F=G.flags[UI.rf];if(!F){UI.mode=null;return}
    const p=roadPath(0,F.n,n);if(!p){toast('Dorthin lässt sich kein Weg bauen');UI.rp=null}else UI.rp=p;UI.sel=n;showPanel();return}
  UI.sel=n;UI.atk=99;showPanel();
  const lim=vh-$('panel').offsetHeight-50,yy=(py(n)-cam.y)*cam.z;if(yy>lim){cam.y+=(yy-lim)/cam.z;clampCam()}
}

function advisor(){
  const own=Object.values(G.blds).filter(b=>b.o==0),has=t=>own.some(b=>b.type==t),P=G.P[0];
  if(UI.mode=='road')return'<b>Wegebau:</b> Tippe das Ziel an (Fahne, Weg oder freies Feld).';
  const nc=own.find(b=>b.nc);if(nc)return`<b>${BD[nc.type].n}</b> hat keinen Weg zur Burg. Antippen und verbinden.`;
  if(!has('woodcutter'))return'<b>Erster Schritt:</b> Tippe neben Bäume und baue einen Holzfäller.';
  if(!has('quarry'))return'Baue einen <b>Steinmetz</b> nahe grauer Felsen.';
  if(!has('sawmill'))return'Ein <b>Sägewerk</b> macht aus Stämmen Bretter (braucht einen großen Bauplatz).';
  if(!has('forester'))return'Ein <b>Förster</b> sorgt für Nachschub an Bäumen.';
  if(!has('hut'))return'Baue eine <b>Wachhütte</b> am Rand deines Gebiets, um es zu erweitern.';
  if(!has('fisher')&&!has('farm'))return'Bergleute brauchen Nahrung: baue einen <b>Fischer</b> am Wasser.';
  if(!own.some(b=>BD[b.type].mine))return'Setze eine Fahne ins Gebirge und schicke einen <b>Geologen</b>. Dann Minen bauen.';
  if(!has('smelter'))return'Eine <b>Eisenschmelze</b> verarbeitet Eisenerz und Kohle zu Eisen.';
  if(!has('weaponsmith'))return'Ein <b>Waffenschmied</b> rüstet neue Ritter aus.';
  if(P.stock.tool<=0&&!has('toolmaker'))return'Werkzeug ist aus: baue einen <b>Werkzeugmacher</b>.';

}

        else{h+=`<p>${b.w==2?(b.empty?'Vorkommen erschöpft oder nicht vorhanden.':b.idle?(def.in?'Wartet auf Rohstoffe.':'Findet nichts in der Nähe.'):'Arbeitet.'):b.w==1?'Arbeiter unterwegs.':b.nt?'Kein Werkzeug für einen Arbeiter im Lager.':'Wartet auf Arbeiter.'}</p>`;
          if(def.in)h+=`<p>Lager: ${stockLine(b.st)}</p>`}

          (av?`<div class="acts"><button class="btn" data-a="atk-">−</button><button class="btn p" data-a="attack">Mit ${UI.atk} angreifen</button><button class="btn" data-a="atk+">+</button></div>`:'<p class="d">Baue Wachgebäude in der Nähe und warte auf Ritter (in jedem Gebäude bleibt einer zurück).</p>')}
      else h+='<p class="d">Erobere die Wachgebäude in der Nähe, dann brennt es nieder.</p>';
    }
  }else if(fid){const F=G.flags[fid];
    if(F.o==0){h=head('Fahne')+`<p>${F.g.length} von 8 Warenplätzen belegt · ${F.r.length} Weg${F.r.length==1?'':'e'}${conn(0,F.id)?'':' · nicht mit der Burg verbunden'}</p><div class="acts"><button class="btn p" data-a="road">Weg bauen</button>${conn(0,F.id)?'':'<button class="btn" data-a="auto">Automatisch verbinden</button>'}<button class="btn" data-a="geo">Geologen senden</button>${F.b?'':'<button class="btn r" data-a="delflag">Fahne entfernen</button>'}</div>`}
    else h=head('Feindliche Fahne');
  }else if(rid&&G.roads[rid].o==0){
    h=head('Weg')+`<p class="d">Mehr Fahnen bedeuten mehr Träger und schnelleren Transport.</p><div class="acts">${canFlag(n,0)?'<button class="btn p" data-a="flag">Fahne setzen</button>':''}<button class="btn r" data-a="delroad">Weg abreißen</button></div>`;
  }else if(G.own[n]===0){

    h=head(sz?['','Kleiner Bauplatz','Großer Bauplatz','Minenplatz'][sz]:tn);

      const b=G.blds[id];if(!conn(0,b.f)&&autoPath(0,b.f)==null)toast('Gebäude gesetzt – noch kein Weg möglich');break}
    case'demolish':if(bid)destroyBld(bid);UI.sel=-1;break;

const HELP=`<h3>So funktioniert es</h3><ul>
<li><b>Karte:</b> ziehen zum Verschieben, zwei Finger zum Zoomen, antippen zum Auswählen.</li>
<li><b>Bauen:</b> freies Feld in deinem Gebiet antippen. Die kleinen Symbole zeigen, was dort passt (Haus klein/groß, Dreieck = Mine, Punkt = nur Fahne).</li>
<li><b>Wege:</b> jedes Gebäude braucht einen Weg von seiner Fahne zur Burg. Zwischen zwei Fahnen läuft genau ein Träger. Viele Fahnen = schneller Transport.</li>
<li><b>Waren:</b> Holzfäller → Sägewerk → Bretter. Steinmetz → Steine. Bauern, Fischer und Bäcker ernähren die Bergleute. Erz + Kohle werden zu Eisen und Gold.</li>
<li><b>Werkzeug:</b> jeder neue Beruf braucht ein Werkzeug aus dem Lager.</li>
<li><b>Gebiet:</b> Wachhütten, Türme und Festungen erweitern die Grenze, sobald ein Ritter einzieht. Jeder Ritter braucht Waffen.</li>
<li><b>Kampf:</b> feindliches Wachgebäude antippen und angreifen. Gold in deinen Gebäuden macht Ritter stärker. Fällt die rote Burg, hast du gewonnen.</li></ul>`;

function unitPos(u){
  if(u.k=='c'){const R=G.roads[u.road];if(!R)return null;const k=Math.min(R.p.length-2,Math.floor(u.pos)),f=u.pos-k,a=R.p[k],b=R.p[k+1];return[fx(a)+(fx(b)-fx(a))*f,py(a)+(py(b)-py(a))*f]}
  if(u.k=='f'){const f=Math.min(1,u.t/Math.max(.01,u.T-1.2));return[fx(u.from)+(fx(u.to)-fx(u.from))*f,py(u.from)+(py(u.to)-py(u.from))*f]}
  if(u.i<0)return null;const k=Math.min(u.p.length-2,Math.floor(u.i)),f=Math.min(1,u.i-k),a=u.p[k],b=u.p[k+1];
  let x=fx(a)+(fx(b)-fx(a))*f,y=py(a)+(py(b)-py(a))*f;if(u.wait){x+=((u.id%5)-2)*5;y+=(u.id%3)*3}return[x,y]}
const ulast=new Map();
function facing(key,x){if(ulast.size>4000)ulast.clear();const p=ulast.get(key);let d=p?p.d:1;if(p){if(x>p.x+.02)d=1;else if(x<p.x-.02)d=-1}ulast.set(key,{x,d});return d}
function drawTree(c,x,y,g,v,sw){
  c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(x+4*g,y+1,9.5*g,3.2*g,0,0,7);c.fill();
  c.fillStyle='#5b3d1e';c.fillRect(x-1.6*g,y-8*g,3.2*g,8.5*g);c.fillStyle='#7c5830';c.fillRect(x-1.6*g,y-8*g,1.2*g,8.5*g);
  if(v<.45){for(let k=0;k<4;k++){const w=(10.5-k*2.3)*g,yy=y-(4+k*6.6)*g,ax=x+sw*k*.35,ay=yy-10*g;
      c.fillStyle='#1b5229';c.beginPath();c.moveTo(x-w,yy);c.lineTo(ax,ay);c.lineTo(x+w,yy);c.closePath();c.fill();
      c.fillStyle='#2f7d3c';c.beginPath();c.moveTo(x-w,yy);c.lineTo(ax,ay);c.lineTo(x-w*.1,yy);c.closePath();c.fill();
      c.fillStyle='rgba(190,230,150,.25)';c.fillRect(x-w*.55,yy-3*g,2*g,1.2*g)}}
  else{const P=v<.75?['#1f5f26','#2f7f2f','#56a53c']:['#3f6d1e','#5d8f2a','#8dbb3f'],B=[[-5.5,-12,6],[5.5,-12.5,6],[0,-10,6.5],[0,-18.5,7.2]];
    for(const[bx,by,r]of B){c.fillStyle=P[0];c.beginPath();c.arc(x+bx*g+sw*.3,y+by*g,r*g,0,7);c.fill()}
    for(const[bx,by,r]of B){c.fillStyle=P[1];c.beginPath();c.arc(x+(bx-1.2)*g+sw*.3,y+(by-1.2)*g,r*.8*g,0,7);c.fill()}
    for(const[bx,by,r]of B){c.fillStyle=P[2];c.beginPath();c.arc(x+(bx-2.4)*g+sw*.3,y+(by-2.6)*g,r*.38*g,0,7);c.fill()}
    if(v>.9&&g>=1){c.fillStyle='#d8362c';for(const[ax,ay]of[[-4,-11],[3,-16],[5,-9]])c.fillRect(x+ax,y+ay,1.6,1.6)}}
}
function draw(time){
  const c=ctx;c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#1e4e86';c.fillRect(0,0,vw,vh);
  if(!G||!terrain)return;

  const sx=Math.max(0,x0),sy=Math.max(0,y0),sw=Math.min(WW,x1)-sx,sh=Math.min(WH,y1)-sy;

  // Wasserglitzern
  for(let r=r0;r<=r1;r++)for(let cc=c0;cc<=c1;cc++){const i=r*W+cc;if(G.t[i]!=0)continue;const hv=hash2(i,11,G.seed);if(hv>.45)continue;
    const a=Math.sin(time*1.6+hv*40);if(a<.2)continue;c.fillStyle=`rgba(225,242,255,${(a-.2)*.4})`;const x=fx(i)+(hv-.2)*30,y=fy0(i)+(hv*97%1-.5)*12;c.fillRect(x,y,7,1);c.fillRect(x+3,y+2,5,1)}
  // Grenzsteine
  for(const i of border){if(G.t[i]==0)continue;const x=fx(i),y=py(i);if(x<x0-9||x>x1+9||y<y0-9||y>y1+9)continue;c.fillStyle='rgba(0,0,0,.25)';c.fillRect(x-1,y,4,1.5);c.fillStyle='#d9d4c6';c.fillRect(x-1.5,y-4,3,5);c.fillStyle=PCOL[G.own[i]];c.fillRect(x-1.5,y-5.5,3,2.5);c.strokeStyle='rgba(30,20,10,.6)';c.lineWidth=.6;c.strokeRect(x-1.5,y-5.5,3,6.5)}
  // Wege
  c.lineCap='round';c.lineJoin='round';
  for(const pass of[0,1,2]){c.strokeStyle=['#6e5730','#b79a63','#d6bf8c'][pass];c.lineWidth=[7,5,2][pass];c.setLineDash(pass==2?[4,5]:[]);c.beginPath();
    for(const id in G.roads){const p=G.roads[id].p;c.moveTo(fx(p[0]),py(p[0]));for(let k=1;k<p.length;k++)c.lineTo(fx(p[k]),py(p[k]))}c.stroke()}
  c.setLineDash([]);
  if(UI.mode=='road'&&UI.rp){c.strokeStyle='#fff';c.lineWidth=3;c.setLineDash([6,5]);c.beginPath();UI.rp.forEach((n,k)=>k?c.lineTo(fx(n),py(n)):c.moveTo(fx(n),py(n)));c.stroke();c.setLineDash([])}
  // Figuren nach Zeilen sortieren
  const rows={};const put=(x,y,o)=>{const r=Math.max(0,Math.round((y-PADT)/TH));(rows[r]=rows[r]||[]).push(o);o.x=x;o.y=y};
  for(const id in G.units){const u=G.units[id],p=unitPos(u);if(!p||p[0]<x0-20||p[0]>x1+20||p[1]<y0-20||p[1]>y1+30)continue;
    const kn=u.role=='att'||u.role=='knight'||u.role=='home',wb=u.role=='worker'?G.blds[u.d]:null;
    put(p[0],p[1],{o:u.o,kind:kn?'knight':u.role=='worker'?(wb?wb.type:'carrier'):u.role,carry:u.k=='c'&&u.g?u.g.t:null,mv:!(u.k=='c'&&u.st==0)&&!u.wait&&!(u.k=='f'&&u.t>u.T-1.2),work:!!u.wait||(u.k=='f'&&u.t>u.T-1.2),ph:u.id,dir:facing(u.id,p[0])})}
  for(const id in G.blds){const b=G.blds[id],J=b.job;if(!J)continue;const f=J.ph==0?J.t/J.T:J.ph==1?1:1-J.t/J.T;
    const x=fx(b.n)+(fx(J.n)-fx(b.n))*f,y=py(b.n)+(py(J.n)-py(b.n))*f;if(x<x0-20||x>x1+20)continue;
    put(x,y+1,{o:b.o,kind:b.type,carry:J.ph==2?J.c:null,mv:J.ph!=1,work:J.ph==1,ph:b.id,dir:facing('j'+b.id,x)})}
  const aid=UI.aid&&z>=.7&&UI.mode!='road';
  for(let r=r0;r<=r1;r++){
    for(let cc=c0;cc<=c1;cc++){const i=r*W+cc,x=fx(i),y=py(i),o=G.obj[i];
      if(o==3){const g=G.ov[i];c.fillStyle='rgba(122,92,48,.6)';c.beginPath();c.ellipse(x,y,16,7.5,0,0,7);c.fill();
        const hgt=1.5+g*5.5;c.fillStyle=g>=1?'#e6c445':`rgb(${96+g*120|0},${160+g*30|0},${56-g*10|0})`;
        for(let ry=-5;ry<=5;ry+=2.5){const hw=14*Math.sqrt(1-ry*ry/49);for(let rx=-hw;rx<=hw;rx+=2.6)c.fillRect(x+rx,y+ry-hgt,1.3,hgt)}
        if(g>=1){c.fillStyle='#f5e08a';for(let ry=-5;ry<=5;ry+=2.5){const hw=14*Math.sqrt(1-ry*ry/49);for(let rx=-hw;rx<=hw;rx+=5.2)c.fillRect(x+rx,y+ry-hgt-1,1.6,1.6)}}}
      else if(o==1)drawTree(c,x,y,.35+.65*G.ov[i],hash2(i,3,G.seed),Math.sin(time*1.3+i)*1.1);
      else if(o==2){const a=G.ov[i],nr=Math.min(3,Math.ceil(a/2));c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(x+2,y+2,5+nr*4,3.5,0,0,7);c.fill();c.lineWidth=1;
        for(let k=0;k<nr;k++){const ox=(k-(nr-1)/2)*8,s=5.5+((i+k)%2)*2;c.fillStyle='#74767b';c.strokeStyle='rgba(30,25,20,.7)';c.beginPath();c.moveTo(x+ox-s,y+2);c.lineTo(x+ox-s*.6,y-s*.9);c.lineTo(x+ox+s*.3,y-s*1.3);c.lineTo(x+ox+s,y-s*.3);c.lineTo(x+ox+s,y+2);c.closePath();c.fill();c.stroke();
          c.fillStyle='#b9bbc0';c.beginPath();c.moveTo(x+ox-s*.6,y-s*.9);c.lineTo(x+ox+s*.3,y-s*1.3);c.lineTo(x+ox+s*.1,y-s*.3);c.lineTo(x+ox-s*.8,y-s*.1);c.closePath();c.fill()}}
      if(G.sign[i]){const s=G.sign[i];c.fillStyle='#5a3c1c';c.fillRect(x-.8,y-9,1.6,9);c.fillStyle=['','#1f1f22','#b3492b','#f0c330','#c2c3c6',,,,,'#f5f1e6'][s];c.fillRect(x-4,y-13,8,6);c.strokeStyle='#2a1c10';c.lineWidth=.8;c.strokeRect(x-4,y-13,8,6);if(s==9){c.beginPath();c.moveTo(x-3,y-12);c.lineTo(x+3,y-8);c.moveTo(x+3,y-12);c.lineTo(x-3,y-8);c.stroke()}}
      if(aid&&G.own[i]===0&&!G.bl[i]&&!G.fl[i]&&!o){const s=canBuildSize(i,0);c.globalAlpha=.8;c.fillStyle='#fff';c.strokeStyle='rgba(20,14,8,.8)';c.lineWidth=1;
        if(s==2){c.beginPath();c.moveTo(x-5,y+3);c.lineTo(x-5,y-2);c.lineTo(x,y-7);c.lineTo(x+5,y-2);c.lineTo(x+5,y+3);c.closePath();c.fill();c.stroke()}
        else if(s==1){c.beginPath();c.moveTo(x-3,y+2);c.lineTo(x-3,y-1);c.lineTo(x,y-4);c.lineTo(x+3,y-1);c.lineTo(x+3,y+2);c.closePath();c.fill();c.stroke()}
        else if(s==3){c.fillStyle='#ffd23a';c.beginPath();c.moveTo(x-4,y+3);c.lineTo(x,y-5);c.lineTo(x+4,y+3);c.closePath();c.fill();c.stroke()}
        else if(!G.rd[i]&&canFlag(i,0)){c.beginPath();c.arc(x,y,1.6,0,7);c.fill()}
        c.globalAlpha=1}
      const fid=G.fl[i];if(fid){const F=G.flags[fid];c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(x+1,y,3.5,1.4,0,0,7);c.fill();
        c.strokeStyle='#4a321a';c.lineWidth=1.6;c.beginPath();c.moveTo(x,y);c.lineTo(x,y-17);c.stroke();c.fillStyle='#e9c23c';c.fillRect(x-1.2,y-19,2.4,2.4);
        const w=Math.sin(time*5+i)*1.8;c.fillStyle=PCOL[F.o];c.beginPath();c.moveTo(x,y-17);c.quadraticCurveTo(x+5,y-18+w,x+10,y-14+w);c.lineTo(x,y-10);c.fill();c.fillStyle=PDARK[F.o];c.beginPath();c.moveTo(x,y-12.5);c.lineTo(x+7,y-13.2+w);c.lineTo(x,y-10);c.fill();
        for(let k=0;k<F.g.length;k++)drawGood(c,F.g[k].t,x-9+(k%4)*6,y+3+(k>>2)*5,.6)}
      const bid=G.bl[i];if(bid){const b=G.blds[bid];drawBld(c,b.type,x,y,PCOL[b.o],b.done?1:b.prog,time,BD[b.type].mil&&b.o==0&&b.done?b.g:undefined)}
    }
    const us=rows[r];if(us)for(const u of us)drawMan(c,u.x,u.y,u.o,G.time,u.mv,u.kind,u.carry,u.dir,u.work,u.ph);
  }
  for(const f of fxs){const x=fx(f.n),y=py(f.n);if(f.k=='fire'){for(let k=0;k<7;k++){const p=(time*1.5+k/7)%1;c.fillStyle=`rgba(255,${110+k*20},30,${.8*(1-p)})`;c.beginPath();c.arc(x+Math.sin(k*2+p*6)*8,y-4-p*24,5*(1-p)+1,0,7);c.fill()}}
    else{c.strokeStyle='#fff7c0';c.lineWidth=1.5;c.beginPath();for(let k=0;k<6;k++){const a=k+time*9;c.moveTo(x+Math.cos(a)*3,y-8+Math.sin(a)*3);c.lineTo(x+Math.cos(a)*9,y-8+Math.sin(a)*9)}c.stroke()}}

  if(UI.mode=='road'&&G.flags[UI.rf]){const n=G.flags[UI.rf].n;c.strokeStyle='#ffd23a';c.lineWidth=2;c.beginPath();c.ellipse(fx(n),py(n),12,6,0,0,7);c.stroke()}
}

let last=0,simAcc=0,uiT=0,saveT=0,running=false;
function frame(ts){
  requestAnimationFrame(frame);const now=ts/1000,rdt=Math.min(.1,now-last||0);last=now;
  if(G&&!G.over&&$('modal').hidden){const T=rdt*UI.speed;if(T>0){const n=Math.ceil(T/.034);for(let k=0;k<n;k++)step(T/n)}
    saveT+=rdt;if(saveT>20){saveT=0;save()}}
  uiT+=rdt;if(uiT>.5&&G){uiT=0;updTop();if(!$('panel').hidden&&UI.sel>=0&&UI.mode!='road'&&!$('panel').querySelector('.grid'))showPanel()}
  draw(now);
}
function start(data){
  makeIcons();resize();window.addEventListener('resize',resize);
  let ok=false;if(data&&data.G)ok=load(data.G);
  let hasSave=false;if(!ok){try{const s=localStorage.getItem('wuselreich-save');if(s)hasSave=load(s)}catch(e){}}
  if(!ok&&!hasSave)newGame(20231112,1);
  afterLoad();if(!ok)showStart(hasSave);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  requestAnimationFrame(frame);
}
try{window.claude?.hot?.snapshot?.(()=>({G}))}catch(e){}
